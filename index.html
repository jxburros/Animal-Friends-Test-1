<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Animal Friends TCG — A Storybook of the First Boroughs</title>
<link rel="stylesheet" href="src/ui/styles.css">
<link rel="stylesheet" href="src/ui/storybook.css">
<link rel="stylesheet" href="src/ui/full-art.css">
</head>
<body>
<div id="app">

  <!-- ============ MENU (book cover) ============ -->
  <section id="screen-menu" class="screen active">
    <div class="book-cover">
      <div class="cover-inner">
        <div class="cover-orn top">❦</div>
        <div class="menu-critters" id="menuCritters"></div>
        <h1 class="logo">Animal Friends</h1>
        <div class="logo-sub">A Storybook of the First Boroughs</div>
        <p class="tagline">Build your town. Win the Capital City. Collect the Statues.</p>
        <p class="expansion-note">Many Hats · 72 new cards · Old friends take up new trades</p>
        <p class="edition" id="edition" title="Which version of the game is loaded">Loading…</p>
        <button type="button" class="full-art-gallery-link" id="fullArtGalleryBtn">Explore the 12 Full Art cards</button>

        <div class="menu-field">
          <div class="menu-label">Choose your deck</div>
          <div class="deck-choice" id="deckChoice"></div>
          <div class="deck-tools">
            <button type="button" id="buildDeckBtn">✎ Build your own deck</button>
            <button type="button" id="editDeckBtn" hidden>Edit this deck</button>
            <button type="button" id="deleteDeckBtn" class="danger" hidden>Delete</button>
          </div>
        </div>

        <div class="menu-field">
          <div class="menu-label">Choose the Capital City</div>
          <div class="deck-choice market-choice" id="marketChoice"></div>
        </div>

        <div class="menu-grid">
          <div class="menu-field">
            <label class="menu-label" for="seedInput">Seed (optional)</label>
            <input type="text" id="seedInput" class="seed-input" placeholder="random" inputmode="numeric">
          </div>
          <div class="menu-field">
            <label class="menu-label" for="paceSelectMenu">Pace</label>
            <select id="paceSelectMenu" class="pace-select">
              <option value="storybook">Storybook — slow, watch every card</option>
              <option value="brisk">Brisk — quicker animations</option>
              <option value="instant">Instant — no animations</option>
            </select>
          </div>
        </div>

        <button class="primary big" id="startGameBtn">Open the book</button>
        <div class="cover-links">
          <button type="button" id="tutorialBtn" title="A short match with the moves laid out for you and a coach explaining each one">Play the tutorial</button>
          <button type="button" id="howToPlayBtn">How to play</button>
          <button type="button" id="welcomeBtn" title="The welcome and introduction to the game">Welcome</button>
        </div>
        <div class="cover-orn bottom">❦</div>
      </div>
    </div>
  </section>

  <!-- ============ DECK WORKSHOP ============ -->
  <section id="screen-deck" class="screen">
    <div class="deckbuilder" id="deckBuilder"></div>
  </section>

  <!-- ============ GAME ============ -->
  <section id="screen-game" class="screen">
    <header class="topbar">
      <div class="turn-banner" id="turnBanner">—</div>
      <div class="topbar-controls">
        <label class="pace-label" for="paceSelect">Pace</label>
        <select id="paceSelect" class="pace-select small">
          <option value="storybook">Storybook</option>
          <option value="brisk">Brisk</option>
          <option value="instant">Instant</option>
        </select>
        <button id="howToPlayBtn2" aria-label="How to play" title="How to play">?</button>
        <button id="quitBtn" class="danger">Close the book</button>
      </div>
    </header>

    <!-- The tutorial's coach: dialog chips that say what to do and why. Empty unless a tutorial is running. -->
    <aside id="coach" class="coach" hidden></aside>

    <div class="town-panel page rival" id="oppTown" data-side="opponent"></div>

    <div class="capital-city-panel page" id="capitalCity"></div>

    <div class="log-panel page">
      <div class="log-title"><span class="orn">❦</span> The Town Chronicle <span class="orn">❦</span></div>
      <div class="log-scroll" id="gameLog"></div>
    </div>

    <div class="town-panel page you" id="yourTown" data-side="you"></div>
  </section>

  <!-- ============ OVERLAYS ============ -->
  <div class="overlay" id="welcomeOverlay">
    <div class="box welcome-box">
      <div class="cover-orn">❦</div>
      <h2>Welcome, Mayor</h2>
      <div class="welcome" id="welcomeBody"></div>
      <div class="welcome-actions">
        <button type="button" class="primary big" id="welcomeTutorialBtn">Play the tutorial</button>
        <button type="button" id="welcomeRulesBtn">Read how to play</button>
        <button type="button" id="welcomePlayBtn">Skip to the cover</button>
      </div>
    </div>
  </div>

  <div class="overlay" id="howToPlayOverlay">
    <div class="box help-box">
      <h2>How to Play</h2>
      <div class="help-tabs" role="tablist" aria-label="How to play">
        <button type="button" class="help-tab on" id="helpTab-quick" role="tab" aria-selected="true" aria-controls="help-quick">Quick start</button>
        <button type="button" class="help-tab" id="helpTab-rules" role="tab" aria-selected="false" aria-controls="help-rules">The rules</button>
        <button type="button" class="help-tab" id="helpTab-faq" role="tab" aria-selected="false" aria-controls="help-faq">Questions &amp; answers</button>
      </div>
      <div class="help" id="help-quick" role="tabpanel"></div>
      <div class="help" id="help-rules" role="tabpanel" hidden></div>
      <div class="help" id="help-faq" role="tabpanel" hidden></div>
      <div class="help-actions">
        <button type="button" id="helpTutorialBtn">Play the tutorial</button>
        <button type="button" class="primary" id="closeHowToPlay">Got it!</button>
      </div>
    </div>
  </div>

  <div class="overlay" id="winOverlay">
    <div class="box win-box">
      <div class="cover-orn">❦</div>
      <h2 id="winTitle">Game Over</h2>
      <p id="winBody"></p>
      <button class="primary big" id="playAgainBtn">Read another story</button>
    </div>
  </div>

  <div class="overlay" id="modalOverlay">
    <div class="box modal-box" id="modalBox"></div>
  </div>

  <div class="popover" id="popover" hidden></div>
  <div class="card-peek" id="cardPeek" hidden></div>

</div>
<script type="module" src="src/ui/main.js"></script>
</body>
</html>
